openapi: 3.1.0

info:
  title: Tournament Manager API
  version: 1.0.0
  summary: API de gestion de tournoi
  description: |
    API REST pour gérer un tournoi.

    Cette version de l'API se concentre sur trois concepts principaux :
    - les équipes
    - les matchs
    - le classement

    Principes de conception :
    - une équipe ne contient pour l'instant qu'un identifiant et un nom
    - un match référence un ensemble d'équipes participantes
    - un score est toujours simple, sur un seul set
    - le score est manipulé via une sous-ressource dédiée `/games/{gameId}/score`
    - le classement est exposé via `/statistics`

    Cette spécification est destinée à devenir la source de vérité du serveur.

servers:
  - url: /
    description: "Serveur courant"
  - url: "http://localhost:8080"
    description: "Serveur local"

tags:
  - name: Teams
    description: |
      Gestion du référentiel des équipes.
      Une équipe est actuellement définie uniquement par son nom.
  - name: Games
    description: |
      Gestion des matchs.
      Un match possède une date planifiée, un terrain, un statut
      et un ensemble d'équipes participantes sans doublon.
  - name: Scores
    description: |
      Gestion du score d'un match.
      Dans cette version, le score est toujours un score simple,
      représenté comme une association entre identifiant d'équipe et nombre de points.
  - name: Statistics
    description: |
      Exposition du classement calculé à partir des matchs et de leurs scores.
  - name: Phases
    description: |
      Gestion et consultation des phases du tournoi.
  - name: AdminAuth
    description: |
      Authentification de la zone d'administration via session HTTP.

paths:
  /api/teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: Lister les équipes
      description: Retourne l'ensemble des équipes connues du système.
      responses:
        '200':
          description: Liste des équipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
              examples:
                default:
                  summary: Exemple de liste d'équipes
                  value:
                    - id: team_1
                      name: Les Furets
                    - id: team_2
                      name: Les Blaireaux

    post:
      tags: [Teams]
      operationId: createTeam
      summary: Créer une équipe
      description: Crée une nouvelle équipe.
      requestBody:
        required: true
        description: Informations de création de l'équipe
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
            examples:
              default:
                summary: Création d'une équipe
                value:
                  name: Les Furets
      responses:
        '201':
          description: Équipe créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
              examples:
                default:
                  value:
                    id: team_1
                    name: Les Furets
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      operationId: getTeamById
      summary: Lire une équipe
      description: Retourne une équipe à partir de son identifiant.
      responses:
        '200':
          description: Équipe trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Teams]
      operationId: updateTeam
      summary: Modifier une équipe
      description: Met à jour le nom d'une équipe existante.
      requestBody:
        required: true
        description: Nouveau contenu de l'équipe
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
            examples:
              default:
                value:
                  name: Les Furets Volants
      responses:
        '200':
          description: Équipe mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: Supprimer une équipe
      description: Supprime une équipe existante.
      responses:
        '204':
          description: Équipe supprimée
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            L'équipe ne peut pas être supprimée car elle est encore référencée
            par un ou plusieurs matchs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                teamUsedInGame:
                  value:
                    code: TEAM_IN_USE
                    message: Team team_1 is still referenced by existing games

  /api/phases:
    get:
      tags: [Phases]
      operationId: listPhases
      summary: Lister les phases
      description: Retourne les phases du tournoi dans l'ordre.
      responses:
        '200':
          description: Liste des phases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Phase'
    post:
      tags: [Phases]
      operationId: createPhase
      summary: Créer une phase
      description: Crée une nouvelle phase du tournoi.
      requestBody:
        required: true
        description: Informations de création de la phase
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhaseRequest'
      responses:
        '201':
          description: Phase créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/phases/{phaseId}:
    parameters:
      - $ref: '#/components/parameters/PhaseId'
    get:
      tags: [Phases]
      operationId: getPhaseById
      summary: Lire une phase
      description: Retourne une phase à partir de son identifiant.
      responses:
        '200':
          description: Phase trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Phases]
      operationId: updatePhase
      summary: Modifier une phase
      description: Met à jour une phase existante.
      requestBody:
        required: true
        description: Nouveau contenu de la phase
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhaseRequest'
      responses:
        '200':
          description: Phase mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Phases]
      operationId: deletePhase
      summary: Supprimer une phase
      description: Supprime une phase existante.
      responses:
        '204':
          description: Phase supprimée
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            La phase ne peut pas être supprimée car elle est encore référencée
            par un ou plusieurs matchs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                phaseUsedInGame:
                  value:
                    code: PHASE_IN_USE
                    message: Phase phase_1 is still referenced by existing games

  /api/phases/{phaseId}/groups:
    parameters:
      - $ref: '#/components/parameters/PhaseId'
    get:
      tags: [Phases]
      operationId: listPhaseGroups
      summary: Lister les groupes d'une phase
      description: Retourne les groupes presents dans la phase demandee.
      responses:
        '200':
          description: Liste des groupes de la phase
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/phases/{phaseId}/teams/{teamId}/group:
    parameters:
      - $ref: '#/components/parameters/PhaseId'
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Phases]
      operationId: getPhaseTeamGroup
      summary: Lire le groupe d'une équipe dans une phase
      description: Retourne le groupe auquel appartient l'equipe donnee dans la phase demandee.
      responses:
        '200':
          description: Groupe de l'équipe dans la phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/games:
    get:
      tags: [Games]
      operationId: listGames
      summary: Lister les matchs
      description: Retourne l'ensemble des matchs connus du système.
      responses:
        '200':
          description: Liste des matchs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
              examples:
                default:
                  value:
                    - id: game_1
                      time: '2026-03-15T18:30:00Z'
                      court: Court A
                      status: scheduled
                      contestants:
                        - id: team_1
                          name: Les Furets
                        - id: team_2
                          name: Les Blaireaux
                      score: null

    post:
      tags: [Games]
      operationId: createGame
      summary: Créer un match
      description: |
        Crée un nouveau match.

        Le match référence un ensemble d'équipes participantes, représenté côté contrat
        par un tableau sans doublon (`uniqueItems: true`).

        Dans cette première version :
        - un match contient au moins 2 équipes
        - les équipes doivent déjà exister
        - le score n'est pas fourni ici ; il est géré via `/games/{gameId}/score`
      requestBody:
        required: true
        description: Informations de création du match
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
            examples:
              default:
                value:
                  time: '2026-03-15T18:30:00Z'
                  court: Court A
                  contestantIds:
                    - team_1
                    - team_2
      responses:
        '201':
          description: Match créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Une ou plusieurs équipes référencées sont introuvables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownTeam:
                  value:
                    code: TEAM_NOT_FOUND
                    message: One or more teams do not exist

  /api/games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [Games]
      operationId: getGameById
      summary: Lire un match
      description: Retourne le détail d'un match.
      responses:
        '200':
          description: Match trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Games]
      operationId: updateGame
      summary: Modifier un match
      description: Met à jour les métadonnées d'un match existant.
      requestBody:
        required: true
        description: Nouveau contenu du match
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameRequest'
            examples:
              default:
                value:
                  time: '2026-03-15T19:00:00Z'
                  court: Court B
                  status: scheduled
                  contestantIds:
                    - team_1
                    - team_2
      responses:
        '200':
          description: Match mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Games]
      operationId: deleteGame
      summary: Supprimer un match
      description: Supprime un match existant.
      responses:
        '204':
          description: Match supprimé
        '404':
          $ref: '#/components/responses/NotFound'

  /api/games/{gameId}/score:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [Scores]
      operationId: getGameScore
      summary: Lire le score d'un match
      description: Retourne le score d'un match s'il existe.
      responses:
        '200':
          description: Score du match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameScore'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Scores]
      operationId: upsertGameScore
      summary: Créer ou remplacer le score d'un match
      description: |
        Définit le score du match en remplaçant intégralement la valeur existante si besoin.
      requestBody:
        required: true
        description: Nouveau score du match
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertGameScoreRequest'
      responses:
        '200':
          description: Score enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameScore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Scores]
      operationId: deleteGameScore
      summary: Supprimer le score d'un match
      description: Supprime le score d'un match existant.
      responses:
        '204':
          description: Score supprimé
        '404':
          $ref: '#/components/responses/NotFound'

  /api/statistics:
    get:
      tags: [Statistics]
      operationId: listRankings
      summary: Lire le classement
      description: |
        Retourne le classement complet de toutes les équipes connues.
      responses:
        '200':
          description: Classement calculé
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContestantStats'
              examples:
                default:
                  value:
                    - contestant:
                        id: team_1
                        name: Les Furets
                      played: 3
                      won: 2
                      drawn: 0
                      lost: 1
                      score: 6
                      pointsFor: 66
                      pointsAgainst: 57
                      pointsDiff: 9
                    - contestant:
                        id: team_2
                        name: Les Blaireaux
                      played: 3
                      won: 1
                      drawn: 0
                      lost: 2
                      score: 3
                      pointsFor: 54
                      pointsAgainst: 60
                      pointsDiff: -6

  /api/statistics/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Statistics]
      operationId: getRankingByTeamId
      summary: Lire le classement d'une équipe
      description: Retourne l'entrée de classement correspondant à une équipe donnée.
      responses:
        '200':
          description: Entrée de classement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestantStats'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/phases/{phaseId}/groups/{groupId}/statistics:
    parameters:
      - $ref: '#/components/parameters/PhaseId'
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Phases]
      operationId: listPhaseGroupRankings
      summary: Lire le classement d'un groupe
      description: |
        Retourne le classement calculé en ne prenant en compte que les matchs
        appartenant au groupe demande au sein de la phase donnee.
      responses:
        '200':
          description: Classement du groupe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContestantStats'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/auth/login:
    post:
      tags: [AdminAuth]
      operationId: loginAdmin
      summary: Ouvrir une session admin
      description: |
        Authentifie un utilisateur admin et ouvre une session HTTP cote serveur.
      requestBody:
        required: true
        description: Identifiants de connexion admin
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
            examples:
              default:
                value:
                  username: admin
                  password: admin123
      responses:
        '200':
          description: Session admin ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '401':
          description: Identifiants invalides

  /api/admin/auth/session:
    get:
      tags: [AdminAuth]
      operationId: getAdminSession
      summary: Lire la session admin courante
      description: Retourne l'etat d'authentification admin de la session HTTP courante.
      responses:
        '200':
          description: Etat courant de la session admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'

  /api/admin/auth/logout:
    post:
      tags: [AdminAuth]
      operationId: logoutAdmin
      summary: Fermer la session admin
      description: Invalide la session HTTP admin courante.
      responses:
        '204':
          description: Session admin fermee

components:
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      description: Identifiant unique d'une équipe
      schema:
        type: string
        minLength: 1
      examples:
        default:
          value: team_1

    GameId:
      name: gameId
      in: path
      required: true
      description: Identifiant unique d'un match
      schema:
        type: string
        minLength: 1
      examples:
        default:
          value: game_1

    GroupId:
      name: groupId
      in: path
      required: true
      description: Identifiant unique d'un groupe
      schema:
        type: string
        minLength: 1
      examples:
        default:
          value: Poule A
    PhaseId:
      name: phaseId
      in: path
      required: true
      description: Identifiant unique d'une phase
      schema:
        type: string
        minLength: 1
      examples:
        default:
          value: phase_1

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              value:
                code: BAD_REQUEST
                message: The request payload is invalid

    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                code: NOT_FOUND
                message: The requested resource does not exist

  schemas:
    AdminLoginRequest:
      type: object
      description: Payload utilise pour se connecter a la zone admin.
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          description: Nom d'utilisateur admin
          examples: [admin]
        password:
          type: string
          minLength: 1
          description: Mot de passe admin
          examples: [admin123]

    AdminSession:
      type: object
      description: Etat de la session admin courante.
      required:
        - authenticated
        - username
      properties:
        authenticated:
          type: boolean
          description: Indique si la session courante est authentifiee
          examples: [true]
        username:
          type: string
          nullable: true
          description: Nom d'utilisateur admin connecte, ou `null` si personne n'est connecte
          examples: [admin]

    Group:
      type: object
      description: Représentation d'un groupe.
      required:
        - id
      properties:
        id:
          type: string
          minLength: 1
          description: Identifiant ou nom du groupe
          examples: [Poule A]

    Team:
      type: object
      description: Équipe participante au tournoi.
      required:
        - id
        - name
      properties:
        id:
          type: string
          minLength: 1
          description: Identifiant unique de l'équipe
          examples: [team_1]
        name:
          type: string
          minLength: 1
          description: Nom affiché de l'équipe
          examples: [Les Furets]

    CreateTeamRequest:
      type: object
      description: Payload utilisé pour créer une équipe.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: Nom de la nouvelle équipe
          examples: [Les Furets]

    UpdateTeamRequest:
      type: object
      description: Payload utilisé pour modifier une équipe existante.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: Nouveau nom de l'équipe
          examples: [Les Furets Volants]

    Game:
      type: object
      description: |
        Représentation d'un match enrichie avec les équipes participantes,
        tandis que les opérations d'écriture utilisent des identifiants.
      required:
        - id
        - phase
        - group
        - time
        - court
        - status
        - contestants
        - score
      properties:
        id:
          type: string
          minLength: 1
          description: Identifiant unique du match
          examples: [game_1]
        phase:
          $ref: '#/components/schemas/Phase'
        name:
          type: string
          nullable: true
          description: |
            Intitule optionnel du match pour les cas particuliers,
            par exemple `Finale` ou `Match de Barrage`.
          examples: [Finale]
        group:
          type: string
          minLength: 1
          description: Identifiant ou nom du groupe du match
          examples: [Poule A]
        time:
          type: string
          format: date-time
          description: Date et heure prévues du match
          examples: ['2026-03-15T18:30:00Z']
        court:
          type: string
          minLength: 1
          description: Nom ou libellé du terrain
          examples: [Court A]
        status:
          $ref: '#/components/schemas/GameStatus'
        contestants:
          type: array
          description: |
            Ensemble des équipes participant au match.
          minItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Team'
        referee:
          allOf:
            - $ref: '#/components/schemas/Team'
          nullable: true
        score:
          allOf:
            - $ref: '#/components/schemas/GameScore'
          nullable: true
          description: |
            Score du match.

            Ce champ vaut `null` tant qu'aucun score n'a encore été saisi.

    GameStatus:
      type: string
      description: État métier d'un match.
      enum:
        - scheduled
        - in_progress
        - completed
        - canceled

    PhaseType:
      type: string
      description: Type de phase du tournoi.
      enum:
        - POOL
        - BRACKET

    Phase:
      type: object
      description: Phase du tournoi a laquelle appartient le match.
      required:
        - id
        - name
        - order
        - type
      properties:
        id:
          type: string
          minLength: 1
          description: Identifiant unique de la phase
          examples: [phase_1]
        name:
          type: string
          minLength: 1
          description: Nom affiche de la phase
          examples: [Poules de brassage]
        details:
          type: string
          description: Description libre optionnelle de la phase, pouvant contenir plusieurs paragraphes.
          examples:
            - |-
              Premiere partie de la competition.

              Les equipes sont reparties en poules de brassage.
        order:
          type: integer
          format: int32
          minimum: 1
          description: Ordre de la phase dans le tournoi
          examples: [1]
        type:
          $ref: '#/components/schemas/PhaseType'

    CreatePhaseRequest:
      type: object
      description: Payload utilisé pour créer une phase.
      required:
        - name
        - order
        - type
      properties:
        name:
          type: string
          minLength: 1
          description: Nom affiche de la phase
          examples: [Poules de brassage]
        details:
          type: string
          description: Description libre optionnelle de la phase, pouvant contenir plusieurs paragraphes.
          examples:
            - |-
              Premiere partie de la competition.

              Les equipes sont reparties en poules de brassage.
        order:
          type: integer
          format: int32
          minimum: 1
          description: Ordre de la phase dans le tournoi
          examples: [1]
        type:
          $ref: '#/components/schemas/PhaseType'

    UpdatePhaseRequest:
      type: object
      description: Payload utilisé pour modifier une phase existante.
      required:
        - name
        - order
        - type
      properties:
        name:
          type: string
          minLength: 1
          description: Nouveau nom affiche de la phase
          examples: [Tableau principal]
        details:
          type: string
          description: Description libre optionnelle de la phase, pouvant contenir plusieurs paragraphes.
          examples:
            - |-
              Tableau final a elimination directe.

              Les demi-finales et finales sont jouees sur le terrain central.
        order:
          type: integer
          format: int32
          minimum: 1
          description: Nouvel ordre de la phase dans le tournoi
          examples: [2]
        type:
          $ref: '#/components/schemas/PhaseType'

    CreateGameRequest:
      type: object
      description: Payload utilisé pour créer un match.
      required:
        - phaseId
        - group
        - time
        - court
        - contestantIds
      properties:
        phaseId:
          type: string
          minLength: 1
          description: Identifiant de la phase du match
          examples: [phase_1]
        name:
          type: string
          nullable: true
          description: |
            Intitule optionnel du match pour les cas particuliers,
            par exemple `Finale` ou `Match de Barrage`.
          examples: [Match de Barrage]
        group:
          type: string
          minLength: 1
          description: Identifiant ou nom du groupe du match
          examples: [Poule A]
        time:
          type: string
          format: date-time
          description: Date et heure prévues du match
          examples: ['2026-03-15T18:30:00Z']
        court:
          type: string
          minLength: 1
          description: Nom ou libellé du terrain
          examples: [Court A]
        contestantIds:
          type: array
          description: |
            Ensemble des identifiants des équipes participantes.
          minItems: 2
          uniqueItems: true
          items:
            type: string
            examples: [team_1]
        refereeId:
          type: string
          nullable: true

    UpdateGameRequest:
      type: object
      description: |
        Payload utilisé pour modifier un match existant.

        Cette opération ne permet pas de modifier le score.
      required:
        - phaseId
        - group
        - time
        - court
        - status
        - contestantIds
      properties:
        phaseId:
          type: string
          minLength: 1
          description: Identifiant de la phase du match
          examples: [phase_2]
        name:
          type: string
          nullable: true
          description: |
            Intitule optionnel du match pour les cas particuliers,
            par exemple `Finale` ou `Match de Barrage`.
          examples: [Finale]
        group:
          type: string
          minLength: 1
          description: Identifiant ou nom du groupe du match
          examples: [Poule B]
        time:
          type: string
          format: date-time
          description: Nouvelle date et heure prévues du match
          examples: ['2026-03-15T19:00:00Z']
        court:
          type: string
          minLength: 1
          description: Nouveau nom ou libellé du terrain
          examples: [Court B]
        status:
          $ref: '#/components/schemas/GameStatus'
        contestantIds:
          type: array
          description: |
            Nouvel ensemble des identifiants des équipes participantes.
          minItems: 2
          uniqueItems: true
          items:
            type: string
            examples: [team_1]
        refereeId:
          type: string
          nullable: true

    ContestantStats:
      type: object
      description: |
        Information .

        Cette vue est calculée à partir des matchs et des scores disponibles.
      required:
        - contestant
        - played
        - won
        - drawn
        - lost
        - score
        - pointsFor
        - pointsAgainst
        - pointsDiff
      properties:
        contestant:
          $ref: '#/components/schemas/Team'
        played:
          type: integer
          format: int32
          minimum: 0
          description: Nombre de matchs joués
          examples: [3]
        won:
          type: integer
          format: int32
          minimum: 0
          description: Nombre de matchs gagnés
          examples: [2]
        drawn:
          type: integer
          format: int32
          minimum: 0
          description: Nombre de matchs gagnés
          examples: [2]
        lost:
          type: integer
          format: int32
          minimum: 0
          description: Nombre de matchs perdus
          examples: [1]
        score:
          type: integer
          format: int32
          minimum: 0
          description: Nombre de matchs perdus
          examples: [1]
        pointsFor:
          type: integer
          format: int32
          description: Total des points marqués
          examples: [66]
        pointsAgainst:
          type: integer
          format: int32
          description: Total des points encaissés
          examples: [57]
        pointsDiff:
          type: integer
          format: int32
          description: Différence entre points marqués et encaissés
          examples: [9]

    GameScore:
      type: object
      description: |
        Score simple d'un match sur un seul set.

        Le score associe chaque identifiant d'équipe participante
        au nombre de points qui lui est attribué.
      required:
        - pointsByTeam
      properties:
        pointsByTeam:
          type: object
          minProperties: 0
          description: |
            Association entre identifiant d'équipe et nombre de points.

            Exemples :
            - `{ "team_1": 21, "team_2": 18 }`
          additionalProperties:
            type: integer
            format: int32
            minimum: 0

    UpsertGameScoreRequest:
      type: object
      description: Payload utilisé pour créer ou remplacer le score d'un match.
      required:
        - pointsByTeam
      properties:
        pointsByTeam:
          type: object
          minProperties: 2
          description: Association entre identifiant d'équipe et nombre de points.
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          examples:
            - team_1: 21
              team_2: 18

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          examples: [BAD_REQUEST]
        message:
          type: string
          minLength: 1
          examples: [The request payload is invalid]
