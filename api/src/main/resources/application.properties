springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.forward-headers-strategy=framework

spring.profiles.default=h2,mock

# Flyway is the only schema initialization mechanism. Hibernate only validates
# that the entity mappings still match the migrated database.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

server.error.path=/error

app.admin.username=admin
app.admin.password=admin123
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
