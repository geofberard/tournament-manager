# Configure DataSource
spring.datasource.url=${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tournament_manager}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${APP_DATASOURCE_USERNAME:tournament}
spring.datasource.password=${APP_DATASOURCE_PASSWORD:}

# Keep enough PostgreSQL connections available while old and new Cloud Run
# revisions coexist during a deployment.
spring.datasource.hikari.maximum-pool-size=${APP_DATASOURCE_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${APP_DATASOURCE_MIN_IDLE:1}
