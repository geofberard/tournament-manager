name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency: release-${{ github.ref_name }}

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  API_REPOSITORY: ${{ vars.GCP_PROJECT_ID }}-api
  API_IMAGE_NAME: ${{ vars.GCP_PROJECT_ID }}-api

jobs:
  api:
    uses: ./.github/workflows/api.yaml

  web:
    uses: ./.github/workflows/web.yaml

  publish-api:
    name: Publish API image 📦
    needs: api
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.API_REPOSITORY }}/${{ env.API_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.API_REPOSITORY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}

  terraform-apply:
    name: Terraform Apply 🏗️
    needs: publish-api
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Extract release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: infra/gcp/app
        run: terraform init -backend-config=backend.hcl

      - name: Terraform apply
        working-directory: infra/gcp/app
        run: terraform apply -auto-approve -var="target_version=${VERSION}"

  deploy-web:
    name: Deploy Web 🚀
    needs:
      - terraform-apply
      - web
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --project="${GCP_PROJECT_ID}" --only=hosting --config=infra/gcp/firebase.json
