name: Web - React
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'web/**'
      - 'contract/**'
      - '.github/workflows/frontend.yml'
permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  WEB_REPOSITORY: ${{ vars.GCP_PROJECT_ID }}-web
  WEB_PACKAGE_NAME: ${{ vars.GCP_PROJECT_ID }}-web
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  build:
    name: Build and Test 🔧
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, test, and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  publish:
    name: Upload static build to Artifact Registry 🚀
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency: ci-web-${{ github.ref }}
    runs-on: ubuntu-latest
    environment: production
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Extract release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Upload dist directory to Artifact Registry
        working-directory: web
        run: |
          gcloud artifacts generic upload \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" \
            --repository="${WEB_REPOSITORY}" \
            --package="${WEB_PACKAGE_NAME}" \
            --version="${VERSION}" \
            --source-directory="dist"

  deploy-github-pages:
    name: Deploy static build to GitHub Pages 🚀
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
