name: Web - React
on:
  push:
    paths:
      - 'web/**'
      - 'contract/**'
      - '.github/workflows/frontend.yml'
permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  WEB_REPOSITORY: ${{ vars.GCP_PROJECT_ID }}-web
  WEB_PACKAGE_NAME: ${{ vars.GCP_PROJECT_ID }}-web

jobs:
  build:
    name: Build and Test 🔧
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, test, and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  publish:
    name: Upload static build to Artifact Registry 🚀
    if: github.ref_name == 'main'
    concurrency: ci-web-${{ github.ref }}
    runs-on: ubuntu-latest
    environment: production
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rebuild dist
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Upload dist directory to Artifact Registry
        working-directory: web
        run: |
          gcloud artifacts generic upload \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" \
            --repository="${WEB_REPOSITORY}" \
            --package="${WEB_PACKAGE_NAME}" \
            --version="${GITHUB_SHA}" \
            --source-directory="dist"
