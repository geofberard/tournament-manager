name: API - Java
on:
  push:
    paths:
      - 'api/**'
      - 'contract/**'
      - '.github/workflows/backend.yml'
permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  API_REPOSITORY: ${{ vars.GCP_PROJECT_ID }}-api
  API_IMAGE_NAME: ${{ vars.GCP_PROJECT_ID }}-api

jobs:
  build:
    name: Build and Test 🔧
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        working-directory: api
        run: mvn clean verify

  publish:
    name: Build and Push Docker 🚀
    if: github.ref_name == 'main'
    concurrency: ci-back-${{ github.ref }}
    runs-on: ubuntu-latest
    environment: production
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.API_REPOSITORY }}/${{ env.API_IMAGE_NAME }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.API_REPOSITORY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
